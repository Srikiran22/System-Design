name: One-time Curriculum Formatting

on:
  push:
    branches:
      - fix/post-merge-curriculum-repair
    paths:
      - ".github/workflows/format-curriculum-repair.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-merge-curriculum-repair
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier to remaining files
        run: npx prettier --write src/lib/neet/curriculum-db.server.ts src/lib/neet/curriculum.functions.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/neet/curriculum-db.server.ts src/lib/neet/curriculum.functions.ts
          if git diff --cached --quiet; then
            echo "The remaining files already match Prettier."
            exit 0
          fi
          git commit -m "style: format curriculum server modules"
          git push origin HEAD:fix/post-merge-curriculum-repair
