name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Format touched screens and show patch
        run: |
          npx prettier --write \
            src/components/neet/Footer.tsx \
            src/components/neet/Nav.tsx \
            src/routes/__root.tsx \
            src/routes/index.tsx \
            src/routes/library.index.tsx
          git diff --no-ext-diff -- \
            src/components/neet/Footer.tsx \
            src/components/neet/Nav.tsx \
            src/routes/__root.tsx \
            src/routes/index.tsx \
            src/routes/library.index.tsx
      - name: Format check
        run: npx prettier --check src scripts
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit, integration & security regression tests
        run: npm test
      - name: Knowledge pack & curriculum integrity check
        run: npm run validate:pack
      - name: Validate sample course bundle template
        run: npm run import:course -- --file docs/curriculum/COURSE_BUNDLE_TEMPLATE.json --dry-run
      - name: Production build
        run: npm run build
      - name: Built application smoke checks
        run: npm run smoke
      - name: Dependency vulnerability audit (high/critical)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
